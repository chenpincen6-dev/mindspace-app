<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #f59e0b; /* 溫暖的食物金黃色 */
            --primary-hover: #d97706;
            --accent: #10b981; /* 綠色象徵省錢/預算 */
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 預算計算法看板 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .stat-card .amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .input-inline {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.5);
            color: white;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* 美食推薦區 */
        .food-section {
            margin-top: 28px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .food-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .food-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .food-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .food-price {
            color: var(--accent);
            font-weight: 700;
        }

        .food-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .tag-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
        }

        .badge.protein {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        /* 記帳紀錄表 */
        .log-section {
            margin-top: 32px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--card-border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .app-container { padding: 18px; }
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo"><i class="fa-solid fa-utensils"></i> BrokeGourmet 月底救星</div>
        <div style="font-size: 0.85rem; color: var(--text-sub);">窮鬼美食與預算算盤</div>
    </header>

    <!-- 1. 預算算盤計算器 -->
    <div class="dashboard">
        <div class="stat-card">
            <h3>距離發薪/發生活費</h3>
            <div class="input-inline">
                <number><input type="number" id="daysLeft" value="7" min="1" onchange="calculateBudget()"></number>
                <span style="align-self: center; color: var(--text-sub);">天</span>
            </div>
        </div>
        <div class="stat-card">
            <h3>目前剩餘總預算 (NT$)</h3>
            <div class="input-inline">
                <input type="number" id="totalMoney" value="1200" step="50" onchange="calculateBudget()">
            </div>
        </div>
        <div class="stat-card" style="border-color: var(--primary);">
            <h3>今日單餐可用預算</h3>
            <div class="amount" id="perMealBudget">NT$ 57</div>
            <div style="font-size: 0.75rem; color: var(--text-sub); margin-top: 4px;" id="dailyBudgetHint
