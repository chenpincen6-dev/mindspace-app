<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet Custom Edition</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #f59e0b;
            --accent: #10b981;
            --blue: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
            --sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: var(--primary); }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .card h3 { font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; }
        .amount { font-size: 1.8rem; font-weight: bold; color: var(--primary); }

        .input-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }

        input, select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            outline: none;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover { opacity: 0.9; }

        .location-bar {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--blue);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .location-bar span { color: var(--blue); font-weight: bold; font-size: 0.9rem; }

        .progress-box {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .tag-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--sub);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .tag-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }

        .food-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-title { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .food-price { color: var(--accent); cursor: pointer; }
        .food-price:hover { text-decoration: underline; }
        .food-desc { font-size: 0.8rem; color: var(--sub); margin-bottom: 10px; }

        .btn-group { display: flex; gap: 4px; }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            cursor: pointer;
        }

        .btn-map {
            background: rgba(56, 189, 248, 0.2);
            color: var(--blue);
            border: 1px solid var(--blue);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .btn-map:hover { background: var(--blue); color: #0f172a; }

        .add-custom-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .log-box {
            margin-top: 24px;
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🍱 BrokeGourmet 月底救星 Custom</div>
        <div style="font-size: 0.8rem; color: var(--sub);">自由調價與自訂菜單版</div>
    </header>

    <!-- 1. 預算算盤 -->
    <div class="dashboard">
        <div class="card">
            <h3>距離發薪/生活費 (天)</h3>
            <div class="input-row">
                <input type="number" id="daysLeft" value="7" min="1" oninput="calc()">
            </div>
        </div>
        <div class="card">
            <h3>剩餘總預算 (NT$)</h3>
            <div class="input-row">
                <input type="number" id="totalMoney" value="1500" step="100" oninput="calc()">
            </div>
        </div>
        <div class="card" style="border-color: var(--primary);">
            <h3>單餐可用預算</h3>
            <div class="amount" id="perMealBudget">NT$ 71</div>
            <div style="font-size:0.75rem; color:var(--sub);" id="dailyMax">每日上限 NT$ 214</div>
        </div>
    </div>

    <!-- 2. 地點連動 -->
    <div class="location-bar">
        <span>📍 地圖搜尋中心點：</span>
        <input type="text" id="userLoc" value="中山大學" placeholder="輸入地標或學校名稱..." style="flex:1;" oninput="saveLoc()">
        <span style="font-size:0.75rem; color:var(--sub);">點擊卡片「🔍 地圖」開 Google Maps！</span>
    </div>

    <!-- 3. 開銷進度條 -->
    <div class="progress-box">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
            <span>今日預算消耗進度</span>
            <span id="progressText">0 / 214 元</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- 4. 新增自訂菜單區 -->
    <div class="add-custom-box">
        <div style="font-size:0.85rem; font-weight:bold; color:var(--primary); margin-bottom:8px;">
            ✨ 新增你學校附近的專屬私房餐點：
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="newFoodName" placeholder="餐點名稱 (如: 應數系樓下便當)" style="flex:2; min-width:140px;">
            <input type="number" id="newFoodPrice" placeholder="價格" style="flex:1; min-width:80px;">
            <select id="newFoodType" style="flex:1; min-width:110px;">
                <option value="canteen">便當/台味</option>
                <option value="street">小吃/滷味</option>
                <option value="jp_kr">日韓料理</option>
                <option value="western">義式美式</option>
                <option value="hotpot">小火鍋</option>
                <option value="cheap">超商/全聯</option>
                <option value="dessert">冰品飲料</option>
            </select>
            <button class="btn" onclick="addNewFoodToDb()">➕ 加入菜單庫</button>
        </div>
    </div>

    <!-- 5. 分類篩選與隨機抽籤 -->
    <div class="filter-row">
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="tag-btn active" onclick="filterFood('all', this)">全部品項</button>
            <button class="tag-btn" onclick="filterFood('street', this)">小吃/滷味</button>
            <button class="tag-btn" onclick="filterFood('canteen', this)">便當/台味</button>
            <button class="tag-btn" onclick="filterFood('jp_kr', this)">日韓料理</button>
            <button class="tag-btn" onclick="filterFood('western', this)">義式美式</button>
            <button class="tag-btn" onclick="filterFood('hotpot', this)">小火鍋</button>
            <button class="tag-btn" onclick="filterFood('cheap', this)">超商/全聯</button>
            <button class="tag-btn" onclick="filterFood('dessert', this)">冰品飲料</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
            <button class="btn" style="background:var(--accent); color:white;" onclick="spinRandom()">🎲 隨機抽籤

    renderLogs();
</script>
</body>
</html>
