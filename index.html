<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .logo { font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        /* 預算面板 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-card h3 { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
        .stat-card .amount { font-size: 2rem; font-weight: 700; color: var(--primary); }

        .input-box { display: flex; gap: 8px; margin-top: 8px; align-items: center; }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: white;
            outline: none;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 進度條 */
        .progress-bar-bg {
            height: 10px;
            background: #0f172a;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 12px;
            border: 1px solid var(--card-border);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s, background-color 0.3s;
        }

        /* 篩選與隨機抽籤 */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .tag-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tag-btn.active {
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
        }

        /* 美食卡片網格 */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }

        .food-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .food-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .food-title { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 6px; }
        .food-price { color: var(--accent); font-weight: 700; }
        .food-desc { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 10px; }
        .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: rgba(16,185,129,0.15); color: #34d399; }

        /* 記帳紀錄 */
        .log-section {
            margin-top: 28px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid var(--card-border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo"><i class="fa-solid fa-utensils"></i> BrokeGourmet 月底救星 Pro</div>
        <div style="font-size: 0.8rem; color: var(--text-sub);">窮鬼美食與動態預算算盤</div>
    </header>

    <!-- 1. 預算算盤 -->
    <div class="dashboard">
        <div class="stat-card">
            <h3>距離發薪/生活費</h3>
            <div class="input-box">
                <input type="number" id="daysLeft" value="7" min="1" oninput="calc()">
                <span style="color: var(--text-sub);">天</span>
            </div>
        </div>
        <div class="stat-card">
            <h3>目前剩餘總預算 (NT$)</h3>
            <div class="input-box">
                <input type="number" id="totalMoney" value="1400" step="50" oninput="calc()">
            </div>
        </div>
        <div class="stat-card" style="border-color: var(--primary);">
            <h3>單餐可用預算上限</h3>
            <div class="amount" id="perMealBudget">NT$ 66</div>
            <div style="font-size: 0.75rem; color: var(--text-sub);" id="dailyMax">每日上限 NT$ 198</div>
        </div>
    </div>

    <!-- 每日開銷進度條 -->
    <div style="margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
            <span>今日預算消耗進度</span>
            <span id="progressText">0 / 198 元</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- 2. 分類與隨機抽籤 -->
    <div class="filter-bar">
        <div style="display:flex; gap:6px;">
            <button class="tag-btn active" onclick="filterFood('all', this)">全部</button>
            <button class="tag-btn" onclick="filterFood('convenience', this)">超商 7 折</button>
            <button class="tag-btn" onclick="filterFood('pxmart', this)">全聯省錢</button>
            <button class="tag-btn" onclick="filterFood('canteen', this)">學校食堂</button>
        </div>
        <button class="btn" style="background: var(--accent); color: white; font-size: 0.85rem;" onclick="spinRandomFood()">
            <i class="fa-solid fa-dice"></i> 幫我選一餐！
        </button>
    </div>

    <!-- 3. 美食卡片列表 -->
    <div class="food-grid" id="foodGrid"></div>

    <!-- 4. 今日記帳 -->
    <div class="log-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span style="font-weight:700;"><i class="fa-solid fa-receipt"></i> 今日飲食記帳</span>
            <span id="todayTotal" style="color:var(--primary); font-weight:700;">今日已花: NT$ 0</span>
        </div>

        <div class="input-box" style="margin-bottom: 12px;">
            <input type="text" id="foodName" placeholder="餐點名稱 (例如: 水煮蛋)">
            <input type="number" id="foodPrice" placeholder="金額" style="width:110px;">
            <button class="btn" onclick="addLog()">記一筆</button>
        </div>

        <div id="logList"></div>
    </div>
</div>

<script>
    const db = [
        { name: "全家友善時光 7折便當", price: 45, type: "convenience", desc: "晚上5點後窮鬼神器，品質好", protein: "18g" },
        { name: "營多印尼炒麵 + 煎蛋", price: 25, type: "pxmart", desc: "極致省錢加蛋補充基礎蛋白質", protein: "8g" },
        { name: "無糖豆漿 + 7-11 溏心蛋", price: 42, type: "convenience", desc: "超商高蛋白省錢組合", protein: "20g" },
        { name: "全聯吐司 + 鮪魚罐頭", price: 50, type: "pxmart", desc: "平分兩餐飽足感拉滿", protein: "18g" },
        { name: "學校食堂自助餐 (菜飯)", price: 65, type: "canteen", desc: "多夾豆腐與青菜，白飯吃飽", protein: "15g" },
        { name: "超商雞胸肉 + 小地瓜", price: 85, type: "convenience", desc: "預算充裕時乾淨飲食首選", protein: "24g" }
    ];

    let logs = JSON.parse(localStorage.getItem('bg_logs')) || [];
    let currentFilter = 'all';

    function calc() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const daily = Math.floor(m / d);
        const perMeal = Math.floor(daily / 3);
        
        document.getElementById('perMealBudget').innerText = `NT$ ${perMeal}`;
        document.getElementById('dailyMax').innerText = `每日上限 NT$ ${daily}`;

        renderFoodGrid(perMeal);
        updateProgress(daily);
    }

    function renderFoodGrid(perMeal) {
        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '';
        
        let list = db.filter(x => x.price <= perMeal + 25);
        if (currentFilter !== 'all') {
            list = list.filter(x => x.type === currentFilter);
        }

        if (list.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-sub); padding:15px;">此分類下沒有符合預算的餐點</div>`;
            return;
        }

        list.forEach(item => {
            grid.innerHTML += `
                <div class="food-card">
                    <div>
                        <div class="food-title">
                            <span>${item.name}</span>
                            <span class="food-price">NT$ ${item.price}</span>
                        </div>
                        <div class="food-desc">${item.desc}</div>
                        <span class="badge"><i class="fa-solid fa-dumbbell"></i> 蛋白約 ${item.protein}</span>
                    </div>
                    <button class="btn" style="font-size:0.8rem; padding:6px 10px; margin-top:10px;" onclick="quickAdd('${item.name}', ${item.price})">+ 吃了這餐</button>
                </div>
            `;
        });
    }

    function filterFood(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calc();
    }

    function spinRandomFood() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const perMeal = Math.floor((m / d) / 3);
        const list = db.filter(x => x.price <= perMeal);
        
        if (list.length === 0) return alert('目前預算太緊繃，建議直接全聯買吐司！');
        
        const randomItem = list[Math.floor(Math.random() * list.length)];
        alert(`🎲 月底大神推薦你吃：【${randomItem.name}】(NT$ ${randomItem.price})`);
    }

    function updateProgress(dailyMax) {
        const sum = logs.reduce((acc, cur) => acc + cur.price, 0);
        document.getElementById('todayTotal').innerText = `今日已花: NT$ ${sum}`;
        document.getElementById('progressText').innerText = `${sum} / ${dailyMax} 元`;

        const percent = Math.min(100, Math.round((sum / (dailyMax || 1)) * 100));
        const bar = document.getElementById('progressBar');
        bar.style.width = `${percent}%`;

        if (percent >= 100) {
            bar.style.background = 'var(--danger)';
        } else {
            bar.style.background = 'var(--accent)';
        }
    }

    function renderLogs() {
        const list = document.getElementById('logList');
        list.innerHTML = '';
        logs.forEach((item, i) => {
            list.innerHTML += `
                <div class="log-item">
                    <span>${item.name}</span>
                    <div>
                        <span style="color:var(--primary); margin-right:10px;">NT$ ${item.price}</span>
                        <i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteLog(${i})"></i>
                    </div>
                </div>
            `;
        });
        localStorage.setItem('bg_logs', JSON.stringify(logs));
        calc();
    }

    function quickAdd(name, price) {
        logs.push({ name, price });
        renderLogs();
    }

    function addLog() {
        const n = document.getElementById('foodName').value.trim();
        const p = parseInt(document.getElementById('foodPrice').value);
        if (n && !isNaN(p)) {
            logs.push({ name: n, price: p });
            document.getElementById('foodName').value = '';
            document.getElementById('foodPrice').value = '';
            renderLogs();
        }
    }

    function deleteLog(i) {
        logs.splice(i, 1);
        renderLogs();
    }

    renderLogs();
</script>
</body>
</html>
