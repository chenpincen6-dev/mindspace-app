<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet Final</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #f59e0b;
            --accent: #10b981;
            --blue: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
            --sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 880px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: var(--primary); }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .card h3 { font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; }
        .amount { font-size: 1.8rem; font-weight: bold; color: var(--primary); }

        .input-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }

        input, select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            outline: none;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover { opacity: 0.9; }

        .location-bar {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--blue);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .location-bar span { color: var(--blue); font-weight: bold; font-size: 0.9rem; }

        .progress-box {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .tag-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--sub);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .tag-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }

        .food-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-title { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .food-price { color: var(--accent); }
        .food-desc { font-size: 0.8rem; color: var(--sub); margin-bottom: 10px; }

        .btn-group { display: flex; gap: 6px; }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            cursor: pointer;
        }

        .btn-map {
            background: rgba(56, 189, 248, 0.2);
            color: var(--blue);
            border: 1px solid var(--blue);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .btn-map:hover { background: var(--blue); color: #0f172a; }

        .add-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .log-box {
            margin-top: 24px;
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🍱 BrokeGourmet 月底救星</div>
        <div style="font-size: 0.8rem; color: var(--sub);">窮鬼預算算盤 + 地圖尋寶</div>
    </header>

    <!-- 1. 預算算盤 -->
    <div class="dashboard">
        <div class="card">
            <h3>距離發薪/生活費 (天)</h3>
            <div class="input-row">
                <input type="number" id="daysLeft" value="7" min="1" oninput="calc()">
            </div>
        </div>
        <div class="card">
            <h3>剩餘總預算 (NT$)</h3>
            <div class="input-row">
                <input type="number" id="totalMoney" value="1500" step="100" oninput="calc()">
            </div>
        </div>
        <div class="card" style="border-color: var(--primary);">
            <h3>單餐可用預算</h3>
            <div class="amount" id="perMealBudget">NT$ 71</div>
            <div style="font-size:0.75rem; color:var(--sub);" id="dailyMax">每日上限 NT$ 214</div>
        </div>
    </div>

    <!-- 2. 地點連動 -->
    <div class="location-bar">
        <span>📍 地圖搜尋中心點：</span>
        <input type="text" id="userLoc" value="中山大學" placeholder="輸入地標或學校名稱..." style="flex:1;" oninput="saveLoc()">
        <span style="font-size:0.75rem; color:var(--sub);">點擊「🔍 地圖」開 Google Maps 導航！</span>
    </div>

    <!-- 3. 開銷進度條 -->
    <div class="progress-box">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
            <span>今日預算消耗進度</span>
            <span id="progressText">0 / 214 元</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- 4. 新增私房餐點 -->
    <div class="add-box">
        <div style="font-size:0.85rem; font-weight:bold; color:var(--primary); margin-bottom:8px;">✨ 新增自訂私房餐點：</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="newFoodName" placeholder="餐點名稱 (如: 樓下排骨飯)" style="flex:2; min-width:130px;">
            <input type="number" id="newFoodPrice" placeholder="價格" style="flex:1; min-width:80px;">
            <select id="newFoodType" style="flex:1; min-width:110px;">
                <option value="canteen">便當/台味</option>
                <option value="street">小吃/滷味</option>
                <option value="jp_kr">日韓/壽司</option>
                <option value="western">義式美式</option>
                <option value="hotpot">小火鍋</option>
                <option value="cheap">超商/全聯</option>
                <option value="dessert">冰品飲料</option>
            </select>
            <button class="btn" onclick="addNewFood()">➕ 加入菜單</button>
        </div>
    </div>

    <!-- 5. 分類與隨機抽籤 -->
    <div class="filter-row">
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="tag-btn active" onclick="filterFood('all', this)">全部</button>
            <button class="tag-btn" onclick="filterFood('street', this)">小吃/滷味</button>
            <button class="tag-btn" onclick="filterFood('canteen', this)">便當/台味</button>
            <button class="tag-btn" onclick="filterFood('jp_kr', this)">日韓/壽司</button>
            <button class="tag-btn" onclick="filterFood('western', this)">義式美式</button>
            <button class="tag-btn" onclick="filterFood('hotpot', this)">小火鍋</button>
            <button class="tag-btn" onclick="filterFood('cheap', this)">超商/全聯</button>
            <button class="tag-btn" onclick="filterFood('dessert', this)">冰品飲料</button>
        </div>
        <button class="btn" style="background:var(--accent); color:white; margin-top:4px;" onclick="spinRandom()">🎲 幫我選一餐</button>
    </div>

    <!-- 6. 菜單網格 -->
    <div class="food-grid" id="foodGrid"></div>

    <!-- 7. 記帳區 -->
    <div class="log-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold;">
            <span>🧾 今日飲食記帳</span>
            <span id="todayTotal" style="color:var(--primary);">已花費: NT$ 0</span>
        </div>

        <div class="input-row" style="margin-bottom: 12px;">
            <input type="text" id="foodName" placeholder="餐點名稱 (如: 鹽水雞套餐)">
            <input type="number" id="foodPrice" placeholder="金額" style="width:110px;">
            <button class="btn" onclick="addLog()">記一筆</button>
        </div>

        <div id="logList"></div>
    </div>
</div>

<script>
    const defaultDb = [
        { name: "加熱滷味", kw: "加熱滷味", price: 65, type: "street", desc: "自由夾選，宵夜正餐皆宜" },
        { name: "鮮嫩鹽水雞", kw: "鹽水雞", price: 80, type: "street", desc: "清爽低脂，補充蛋白質" },
        { name: "香雞排 + 甜不辣", kw: "雞排 鹹酥雞", price: 95, type: "street", desc: "罪惡感滿點快樂解壓" },
        { name: "台式乾麵 + 貢丸湯", kw: "乾麵 餛飩湯", price: 65, type: "street", desc: "古早味麵攤高CP值" },
        { name: "學校食堂自助餐", kw: "自助餐 學生餐廳", price: 65, type: "canteen", desc: "夾滿蔬菜豆腐，白飯吃飽" },
        { name: "排骨便當 / 雞腿便當", kw: "排骨便當 雞腿飯", price: 95, type: "canteen", desc: "經典台味，份量超滿足" },
        { name: "平價雞肉飯", kw: "雞肉飯 便當", price: 60, type: "canteen", desc: "淋上雞油鹹香順口" },
        { name: "港式燒臘雙拼飯", kw: "燒臘便當", price: 110, type: "canteen", desc: "肉香四溢，蔥油超開胃" },
        { name: "健康舒肥雞胸肉餐盒", kw: "健康餐盒 舒肥雞", price: 115, type: "canteen", desc: "控卡必吃低油清爽便當" },
        { name: "爭鮮/平價迴轉壽司", kw: "迴轉壽司 壽司", price: 150, type: "jp_kr", desc: "生魚片握壽司小資選擇" },
        { name: "濃郁日式拉麵", kw: "日式拉麵", price: 180, type: "jp_kr", desc: "濃厚湯頭配大塊叉燒" },
        { name: "韓式豆腐鍋 / 部隊鍋", kw: "韓式豆腐鍋", price: 160, type: "jp_kr", desc: "酸辣開胃附小菜白飯" },
        { name: "個人單人燒肉定食", kw: "燒肉定食", price: 280, type: "jp_kr", desc: "預算充裕時的大口吃肉" },
        { name: "平價義大利麵", kw: "義大利麵", price: 120, type: "western", desc: "濃郁白醬/紅醬可加麵" },
        { name: "美式雙層起司牛肉堡", kw: "美式漢堡", price: 180, type: "western", desc: "多汁牛肉排配薯條" },
        { name: "百元平價小火鍋", kw: "小火鍋 臭臭鍋", price: 160, type: "hotpot", desc: "白飯飲料冰淇淋吃到飽" },
        { name: "全家 友善時光 7折便當", kw: "全家 友善時光", price: 45, type: "cheap", desc: "晚上5點後窮鬼神器" },
        { name: "7-11 i珍食 7折餐盒", kw: "7-11 i珍食", price: 49, type: "cheap", desc: "晚上8點後7折優惠" },
        { name: "營多印尼炒麵 + 煎蛋", kw: "全聯", price: 25, type: "cheap", desc: "極致省錢加蛋補蛋白質" },
        { name: "古早味剉冰 (選4種料)", kw: "剉冰 冰店", price: 60, type: "dessert", desc: "芋圓紅豆仙草消暑神器" },
        { name: "手搖飲 + 雞蛋糕/紅豆餅", kw: "手搖飲料 雞蛋糕", price: 75, type: "dessert", desc: "下午茶快樂小點心" }
    ];

    let db = JSON.parse(localStorage.getItem('bg_db_fix')) || defaultDb;
    let logs = JSON.parse(localStorage.getItem('bg_logs_fix')) || [];
    let currentLoc = localStorage.getItem('bg_loc_fix') || '中山大學';
    let currentFilter = 'all';

    document.getElementById('userLoc').value = currentLoc;

    function saveLoc() {
        currentLoc = document.getElementById('userLoc').value.trim() || '附近';
        localStorage.setItem('bg_loc_fix', currentLoc);
        calc();
    }

    function saveDb() {
        localStorage.setItem('bg_db_fix', JSON.stringify(db));
    }

    function editPrice(idx) {
        const p = prompt(`修改【${db[idx].name}】的金額 (NT$)：`, db[idx].price);
        if (p && !isNaN(parseInt(p)) && parseInt(p) > 0) {
            db[idx].price = parseInt(p);
            saveDb();
            calc();
        }
    }

    function addNewFood() {
        const n = document.getElementById('newFoodName').value.trim();
        const p = parseInt(document.getElementById('newFoodPrice').value);
        const t = document.getElementById('newFoodType').value;

        if (n && !isNaN(p) && p > 0) {
            db.push({ name: n, kw: n, price: p, type: t, desc: "私房新增餐點" });
            saveDb();
            document.getElementById('newFoodName').value = '';
            document.getElementById('newFoodPrice').value = '';
            calc();
            alert(`已成功將【${n}】加入菜單！`);
        } else {
            alert("請填寫餐點名稱與金額！");
        }
    }

    function calc() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const daily = Math.floor(m / d);
        const perMeal = Math.floor(daily / 3);
        
        document.getElementById('perMealBudget').innerText = `NT$ ${perMeal}`;
        document.getElementById('dailyMax').innerText = `每日上限 NT$ ${daily}`;

        renderGrid(perMeal);
        updateProgress(daily);
    }

    function renderGrid(perMeal) {
        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '';
        
        let list = db;
        if (currentFilter !== 'all') {
            list = list.filter(x => x.type === currentFilter);
        }

        list.forEach((item, idx) => {
            const isOver = item.price > perMeal;
            const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentLoc + ' ' + item.kw)}`;

            grid.innerHTML += `
                <div class="food-card" style="${isOver ? 'opacity:0.5;' : ''}">
                    <div>
                        <div class="food-title">
                            <span>${item.name}</span>
                            <span class="food-price">NT$ ${item.price}</span>
                        </div>
                        <div class="food-desc">${item.desc}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn" style="flex:1; font-size:0.75rem; padding:6px;" onclick="quickAdd('${item.name}', ${item.price})">+ 吃這個</button>
                        <button class="btn-sm" onclick="editPrice(${idx})">改價</button>
                        <a href="${mapsUrl}" target="_blank" class="btn-map">🔍 地圖</a>
                    </div>
                </div>
            `;
        });
    }

    function filterFood(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calc();
    }

    function spinRandom() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const perMeal = Math.floor((m / d) / 3);
        const list = db.filter(x => x.price <= perMeal + 25);
        
        if (list.length === 0) return alert('預算較緊，建議全聯買吐司或泡麵！');
        const item = list[Math.floor(Math.random() * list.length)];
        const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentLoc + ' ' + item.kw)}`;
        
        if (confirm(`🎲 隨機推薦：【${item.name}】 (NT$ ${item.price})\n\n要在 Google Maps 搜尋【${currentLoc}】附近的【${item.name}】嗎？`)) {
            window.open(mapsUrl, '_blank');
        }
    }

    function updateProgress(dailyMax) {
        const sum = logs.reduce((acc, cur) => acc + cur.price, 0);
        document.getElementById('todayTotal').innerText = `已花費: NT$ ${sum}`;
        
        const percent = Math.min(100, Math.round((sum / (dailyMax || 1)) * 100));
        const bar = document.getElementById('progressBar');
        bar.style.width = `${percent}%`;

        if (sum > dailyMax && dailyMax > 0) {
            bar.style.background = 'var(--danger)';
            document.getElementById('progressText').innerText = `${sum} / ${dailyMax} 元 (⚠️爆預算囉！)`;
            document.getElementById('progressText').style.color = 'var(--danger)';
        } else {
            bar.style.background = 'var(--accent)';
            document.getElementById('progressText').innerText = `${sum} / ${dailyMax} 元`;
            document.getElementById('progressText').style.color = 'var(--sub)';
        }
    }

    function renderLogs() {
        const list = document.getElementById('logList');
        list.innerHTML = '';
        logs.forEach((item, i) => {
            list.innerHTML += `
                <div class="log-item">
                    <span>${item.name}</span>
                    <div>
                        <span style="color:var(--primary); margin-right:10px;">NT$ ${item.price}</span>
                        <span style="color:var(--danger); cursor:pointer;" onclick="deleteLog(${i})">🗑️</span>
                    </div>
                </div>
            `;
        });
        localStorage.setItem('bg_logs_fix', JSON.stringify(logs));
        calc();
    }

    function quickAdd(name, price) {
        logs.push({ name, price });
        renderLogs();
    }

    function addLog() {
        const n = document.getElementById('foodName').value.trim();
        const p = parseInt(document.getElementById('foodPrice').value);
        if (n && !isNaN(p)) {
            logs.push({ name: n, price: p });
            document.getElementById('foodName').value = '';
            document.getElementById('foodPrice').value = '';
            renderLogs();
        }
    }

    function deleteLog(i) {
        logs.splice(i, 1);
        renderLogs();
    }

    // 啟動渲染
    renderLogs();
</script>
</body>
</html>
