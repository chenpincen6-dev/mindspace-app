<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet Maps</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --primary: #f59e0b;
            --accent: #10b981;
            --blue: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
            --sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: var(--primary); }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .card h3 { font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; }
        .amount { font-size: 1.8rem; font-weight: bold; color: var(--primary); }

        .input-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }

        input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            outline: none;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover { opacity: 0.9; }

        /* 地點與地圖搜尋設定區 */
        .location-bar {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--blue);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .location-bar span { color: var(--blue); font-weight: bold; font-size: 0.9rem; }

        /* 進度條 */
        .progress-box {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }

        /* 標籤按鈕 */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .tag-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--sub);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tag-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }

        /* 菜單網格 */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }

        .food-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-title { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .food-price { color: var(--accent); }
        .food-desc { font-size: 0.8rem; color: var(--sub); margin-bottom: 10px; }

        .btn-group { display: flex; gap: 6px; }

        .btn-map {
            background: rgba(56, 189, 248, 0.2);
            color: var(--blue);
            border: 1px solid var(--blue);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .btn-map:hover { background: var(--blue); color: #0f172a; }

        .log-box {
            margin-top: 24px;
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🍱 BrokeGourmet 月底救星 + 地圖導航</div>
        <div style="font-size: 0.8rem; color: var(--sub);">窮鬼預算算盤</div>
    </header>

    <!-- 1. 預算算盤 -->
    <div class="dashboard">
        <div class="card">
            <h3>距離發薪/生活費 (天)</h3>
            <div class="input-row">
                <input type="number" id="daysLeft" value="7" min="1" oninput="calc()">
            </div>
        </div>
        <div class="card">
            <h3>剩餘總預算 (NT$)</h3>
            <div class="input-row">
                <input type="number" id="totalMoney" value="1200" step="100" oninput="calc()">
            </div>
        </div>
        <div class="card" style="border-color: var(--primary);">
            <h3>單餐可用預算</h3>
            <div class="amount" id="perMealBudget">NT$ 57</div>
            <div style="font-size:0.75rem; color:var(--sub);" id="dailyMax">每日上限 NT$ 171</div>
        </div>
    </div>

    <!-- 2. 地點連動 -->
    <div class="location-bar">
        <span>📍 地圖搜尋中心點：</span>
        <input type="text" id="userLoc" value="中山大學" placeholder="輸入地標或學校名稱..." style="flex:1;" oninput="saveLoc()">
        <span style="font-size:0.75rem; color:var(--sub);">點擊卡片「🔍 地圖尋找」自動開 Google Maps 找周邊美食！</span>
    </div>

    <!-- 3. 開銷進度條 -->
    <div class="progress-box">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
            <span>今日預算消耗進度</span>
            <span id="progressText">0 / 171 元</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- 4. 分類與隨機抽籤 -->
    <div class="filter-row">
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="tag-btn active" onclick="filterFood('all', this)">全部餐點</button>
            <button class="tag-btn" onclick="filterFood('convenience', this)">超商 7 折</button>
            <button class="tag-btn" onclick="filterFood('pxmart', this)">全聯省錢</button>
            <button class="tag-btn" onclick="filterFood('canteen', this)">學食/便當</button>
            <button class="tag-btn" onclick="filterFood('luxury', this)">質感輕奢</button>
        </div>
        <button class="btn" style="background:var(--accent); color:white;" onclick="spinRandom()">🎲 幫我選一餐</button>
    </div>

    <!-- 5. 菜單網格 -->
    <div class="food-grid" id="foodGrid"></div>

    <!-- 6. 記帳區 -->
    <div class="log-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold;">
            <span>🧾 今日飲食記帳</span>
            <span id="todayTotal" style="color:var(--primary);">已花費: NT$ 0</span>
        </div>

        <div class="input-row" style="margin-bottom: 12px;">
            <input type="text" id="foodName" placeholder="餐點名稱 (如: 水煮蛋)">
            <input type="number" id="foodPrice" placeholder="金額" style="width:110px;">
            <button class="btn" onclick="addLog()">記一筆</button>
        </div>

        <div id="logList"></div>
    </div>
</div>

<script>
    const db = [
        { name: "全家 友善時光 7折便當", kw: "全家便利商店 友善時光", price: 45, type: "convenience", desc: "晚上5點後省錢神器" },
        { name: "7-11 i珍食 7折餐盒", kw: "7-ELEVEN i珍食", price: 49, type: "convenience", desc: "晚上8點後7折優惠" },
        { name: "營多印尼炒麵 + 煎蛋", kw: "全聯福利中心", price: 25, type: "pxmart", desc: "極致省錢加蛋補充蛋白質" },
        { name: "無糖豆漿 + 溏心蛋", kw: "便利商店 豆漿 溏心蛋", price: 42, type: "convenience", desc: "超商高蛋白省錢組合" },
        { name: "全聯吐司 + 鮪魚罐頭", kw: "全聯福利中心 鮪魚罐頭", price: 50, type: "pxmart", desc: "平分兩餐飽足感拉滿" },
        { name: "學校食堂/學生餐廳", kw: "自助餐 便當", price: 65, type: "canteen", desc: "多夾豆腐與青菜，白飯吃飽" },
        { name: "平價雞肉飯 / 火雞肉飯", kw: "雞肉飯 便當", price: 60, type: "canteen", desc: "台式小吃高CP值首選" },
        { name: "超商雞胸肉 + 地瓜", kw: "7-ELEVEN 雞胸肉 地瓜", price: 85, type: "convenience", desc: "乾淨飲食高飽足感" },
        { name: "健康舒肥雞胸肉餐盒", kw: "健康餐盒 舒肥雞", price: 110, type: "luxury", desc: "低油優質蛋白餐盒" },
        { name: "精緻日式拉麵", kw: "拉麵", price: 180, type: "luxury", desc: "預算充裕時的享受" },
        { name: "雙主菜豪華便當", kw: "燒肉便當 自助餐", price: 150, type: "luxury", desc: "肉量爆棚超滿足" }
    ];

    let logs = JSON.parse(localStorage.getItem('bg_logs_v3')) || [];
    let currentLoc = localStorage.getItem('bg_loc_v3') || '中山大學';
    let currentFilter = 'all';

    document.getElementById('userLoc').value = currentLoc;

    function saveLoc() {
        currentLoc = document.getElementById('userLoc').value.trim() || '附近';
        localStorage.setItem('bg_loc_v3', currentLoc);
        calc();
    }

    function calc() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const daily = Math.floor(m / d);
        const perMeal = Math.floor(daily / 3);
        
        document.getElementById('perMealBudget').innerText = `NT$ ${perMeal}`;
        document.getElementById('dailyMax').innerText = `每日上限 NT$ ${daily}`;

        renderGrid(perMeal);
        updateProgress(daily);
    }

    function renderGrid(perMeal) {
        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '';
        
        let list = db;
        if (currentFilter !== 'all') {
            list = list.filter(x => x.type === currentFilter);
        }

        list.forEach(item => {
            const isOver = item.price > perMeal;
            const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentLoc + ' ' + item.kw)}`;

            grid.innerHTML += `
                <div class="food-card" style="${isOver ? 'opacity:0.5;' : ''}">
                    <div>
                        <div class="food-title">
                            <span>${item.name}</span>
                            <span class="food-price">NT$ ${item.price}</span>
                        </div>
                        <div class="food-desc">${item.desc}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn" style="flex:1; font-size:0.75rem; padding:6px;" onclick="quickAdd('${item.name}', ${item.price})">+ 吃這個</button>
                        <a href="${mapsUrl}" target="_blank" class="btn-map">🔍 地圖尋找</a>
                    </div>
                </div>
            `;
        });
    }

    function filterFood(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calc();
    }

    function spinRandom() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const perMeal = Math.floor((m / d) / 3);
        const list = db.filter(x => x.price <= perMeal + 20);
        
        if (list.length === 0) return alert('預算較緊，建議全聯買吐司或泡麵！');
        const item = list[Math.floor(Math.random() * list.length)];
        const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentLoc + ' ' + item.kw)}`;
        
        if (confirm(`🎲 隨機抽取推薦：【${item.name}】 (NT$ ${item.price})\n\n要打開 Google Maps 尋找附近的【${item.name}】嗎？`)) {
            window.open(mapsUrl, '_blank');
        }
    }

    function updateProgress(dailyMax) {
        const sum = logs.reduce((acc, cur) => acc + cur.price, 0);
        document.getElementById('todayTotal').innerText = `已花費: NT$ ${sum}`;
        
        const percent = Math.min(100, Math.round((sum / (dailyMax || 1)) * 100));
        const bar = document.getElementById('progressBar');
        bar.style.width = `${percent}%`;

        if (sum > dailyMax && dailyMax > 0) {
            bar.style.background = 'var(--danger)';
            document.getElementById('progressText').innerText = `${sum} / ${dailyMax} 元 (⚠️爆預算了！)`;
            document.getElementById('progressText').style.color = 'var(--danger)';
        } else {
            bar.style.background = 'var(--accent)';
            document.getElementById('progressText').innerText = `${sum} / ${dailyMax} 元`;
            document.getElementById('progressText').style.color = 'var(--sub)';
        }
    }

    function renderLogs() {
        const list = document.getElementById('logList');
        list.innerHTML = '';
        logs.forEach((item, i) => {
            list.innerHTML += `
                <div class="log-item">
                    <span>${item.name}</span>
                    <div>
                        <span style="color:var(--primary); margin-right:10px;">NT$ ${item.price}</span>
                        <span style="color:var(--danger); cursor:pointer;" onclick="deleteLog(${i})">🗑️</span>
                    </div>
                </div>
            `;
        });
        localStorage.setItem('bg_logs_v3', JSON.stringify(logs));
        calc();
    }

    function quickAdd(name, price) {
        logs.push({ name, price });
        renderLogs();
    }

    function addLog() {
        const n = document.getElementById('foodName').value.trim();
        const p = parseInt(document.getElementById('foodPrice').value);
        if (n && !isNaN(p)) {
            logs.push({ name: n, price: p });
            document.getElementById('foodName').value = '';
            document.getElementById('foodPrice').value = '';
            renderLogs();
        }
    }

    function deleteLog(i) {
        logs.splice(i, 1);
        renderLogs();
    }

    renderLogs();
</script>
</body>
</html>
