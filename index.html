<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月底救星：窮鬼美食與預算算盤 BrokeGourmet</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.15);
            --primary: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .logo { font-size: 1.3rem; font-weight: 700; color: var(--primary); }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-card h3 { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
        .stat-card .amount { font-size: 1.8rem; font-weight: 700; color: var(--primary); }

        .input-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: white;
            outline: none;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .food-section { margin-top: 24px; }
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: var(--primary); }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .food-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .food-title { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .food-price { color: var(--accent); }
        .food-desc { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; }

        .log-section {
            margin-top: 24px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--card-border);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo"><i class="fa-solid fa-utensils"></i> BrokeGourmet 月底救星</div>
        <div style="font-size: 0.8rem; color: var(--text-sub);">預算與美食計算器</div>
    </header>

    <div class="dashboard">
        <div class="stat-card">
            <h3>距離發薪/生活費 (天)</h3>
            <div class="input-box">
                <input type="number" id="daysLeft" value="7" min="1" oninput="calc()">
            </div>
        </div>
        <div class="stat-card">
            <h3>剩餘總預算 (NT$)</h3>
            <div class="input-box">
                <input type="number" id="totalMoney" value="1400" step="50" oninput="calc()">
            </div>
        </div>
        <div class="stat-card" style="border-color: var(--primary);">
            <h3>單餐可用預算</h3>
            <div class="amount" id="perMealBudget">NT$ 66</div>
        </div>
    </div>

    <div class="food-section">
        <div class="section-title"><i class="fa-solid fa-burger"></i> 推薦省錢美食組合</div>
        <div class="food-grid" id="foodGrid"></div>
    </div>

    <div class="log-section">
        <div class="section-title" style="display:flex; justify-content:space-between;">
            <span><i class="fa-solid fa-receipt"></i> 今日飲食記帳</span>
            <span id="todayTotal" style="color:var(--accent);">已花費: NT$ 0</span>
        </div>

        <div class="input-box" style="margin-bottom: 12px;">
            <input type="text" id="foodName" placeholder="餐點名稱">
            <input type="number" id="foodPrice" placeholder="金額" style="width:100px;">
            <button class="btn" onclick="addLog()">記一筆</button>
        </div>

        <div id="logList"></div>
    </div>
</div>

<script>
    const db = [
        { name: "全家友善時光 7折便當", price: 45, desc: "晚上5點後窮鬼神器" },
        { name: "營多印尼炒麵 + 煎蛋", price: 25, desc: "極致省錢加蛋補蛋白質" },
        { name: "無糖豆漿 + 7-11 溏心蛋", price: 42, desc: "超商高蛋白省錢組合" },
        { name: "全聯吐司 + 鮪魚罐頭", price: 50, desc: "平分兩餐吃飽飽" },
        { name: "學校食堂自助餐", price: 65, desc: "多夾豆腐與青菜" },
        { name: "超商雞胸肉 + 小地瓜", price: 85, desc: "預算充裕時健康吃" }
    ];

    let logs = [];

    function calc() {
        const d = Math.max(1, parseInt(document.getElementById('daysLeft').value) || 1);
        const m = Math.max(0, parseInt(document.getElementById('totalMoney').value) || 0);
        const perMeal = Math.floor((m / d) / 3);
        
        document.getElementById('perMealBudget').innerText = `NT$ ${perMeal}`;

        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '';
        
        db.filter(x => x.price <= perMeal + 20).forEach(item => {
            grid.innerHTML += `
                <div class="food-card">
                    <div>
                        <div class="food-title"><span>${item.name}</span><span class="food-price">NT$ ${item.price}</span></div>
                        <div class="food-desc">${item.desc}</div>
                    </div>
                    <button class="btn" style="font-size:0.75rem; padding:4px 8px;" onclick="quickAdd('${item.name}', ${item.price})">+ 吃這個</button>
                </div>
            `;
        });
    }

    function renderLogs() {
        const list = document.getElementById('logList');
        let sum = 0;
        list.innerHTML = '';
        logs.forEach((item, i) => {
            sum += item.price;
            list.innerHTML += `<div class="log-item"><span>${item.name}</span><span style="color:var(--primary)">NT$ ${item.price}</span></div>`;
        });
        document.getElementById('todayTotal').innerText = `已花費: NT$ ${sum}`;
    }

    function quickAdd(name, price) {
        logs.push({ name, price });
        renderLogs();
    }

    function addLog() {
        const n = document.getElementById('foodName').value.trim();
        const p = parseInt(document.getElementById('foodPrice').value);
        if (n && !isNaN(p)) {
            logs.push({ name: n, price: p });
            document.getElementById('foodName').value = '';
            document.getElementById('foodPrice').value = '';
            renderLogs();
        }
    }

    // 啟動計算
    calc();
</script>
</body>
</html>
